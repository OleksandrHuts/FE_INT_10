<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="edit_user_modal">
        <p>Edit user</p>
        <div class="input_row">
            <input type="text" name="user_first_name" placeholder="John">
        </div>
        <div class="input_row">
            <input type="text" name="user_last_name" placeholder="Doe">
        </div>
        <div class="input_row">
            <input type="text" name="user_role" placeholder="Admin">
        </div>
        <div class="input_row">
            <input type="text" name="user_salary" placeholder="1000">
        </div>
        <div class="input_row">
            <button onclick="editConfirm()" class="edit_submit">Edit</button>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>👥 User's control system</h1>
        </div>

        <div class="crud-container">
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" class="app-input" id="search-value" placeholder="John">
                    <button class="btn btn-primary" onclick="searchUser()">🔍 Search user...</button>

                    <div>
                        <input type="text" class="app-input" name="first_name" id="user_f_name" placeholder="John">
                        <input type="text" class="app-input" name="last_name" id="user_l_name" placeholder="Doe">
                        <input type="text" class="app-input" name="salary" id="user_salary" placeholder="100$">
                        <button class="btn btn-primary" onclick="addNewUser()">+ Add user</button>
                    </div>
                    
                </div>
                <div class="table-info">
                    <span id="user-count">Total: 0</span>
                </div>
            </div>

            <table class="users-table">
                <thead>
                    <tr>
                        <th onclick="sortTable('first_name')">First name</th>
                        <th onclick="sortTable('last_name')">Last name</th>
                        <th onclick="sortTable('role')">Role</th>
                        <th onclick="sortTable('salary')">Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
