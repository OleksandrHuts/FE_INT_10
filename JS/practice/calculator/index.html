<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="operation-value" id="operation-value"></div>
            <div class="current-operand" id="current-operand">0</div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons-grid">
            <button class="clear span-two">AC</button>
            <button class="clear">DEL</button>
            <button class="operation" data-value="divide">÷</button>
            
            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operation" data-value="multiply">×</button>
            
            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operation" data-value="minus">−</button>
            
            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operation" data-value="plus">+</button>
            
            <button class="number zero" data-value="0">0</button>
            <button class="number" >.</button>
            <button class="equals">=</button>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
